<!doctype html>
<!--
  THE PRECA UNDERGROUND: complete frontend in one file.
  No build step, no dependencies. Fonts and avatars are embedded at the bottom.

  To merge with your backend:
    1. Serve this file from your server (e.g. as the index page).
    2. In CONFIG below set BACKEND: 'http' (and API_URL / WS_URL if not same-origin).
    3. Implement the contract described in the "BACKEND CONTRACT" comment.
  Open it directly in a browser with BACKEND: 'mock' to try everything offline
  (code: UNDERGROUND, add ?gate=open to the URL to skip the 20:00-21:00 window).
-->
<html lang="en" style="background:#000">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Underground" />
<meta name="robots" content="noindex, nofollow" />
<title>The Preca Underground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cg fill='none' stroke='%2342ff68' stroke-width='5'%3E%3Cpath d='M21 29v-8a11 11 0 0 1 22 0v8'/%3E%3Crect x='14' y='29' width='36' height='26'/%3E%3C/g%3E%3Crect x='30' y='36' width='4' height='11' fill='%2342ff68'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   THEME
   ============================================================ */
:root {
  color-scheme: dark;
  --g: 66 255 104;   /* phosphor green  */
  --c: 64 240 255;   /* neon cyan (you) */
  --r: 255 72 72;    /* alarm red       */
  --w: 226 232 228;  /* offline white   */
  --green: rgb(var(--g));
  --cyan: rgb(var(--c));
  --red: rgb(var(--r));
  --dim: rgb(var(--g) / 0.55);
  --faint: rgb(var(--g) / 0.22);
  --hair: rgb(var(--g) / 0.14);
  --glow: 0 0 1px rgb(var(--g) / 0.9), 0 0 6px rgb(var(--g) / 0.42), 0 0 16px rgb(var(--g) / 0.16);
  --glow-c: 0 0 1px rgb(var(--c) / 0.9), 0 0 6px rgb(var(--c) / 0.45), 0 0 16px rgb(var(--c) / 0.18);
  --glow-r: 0 0 1px rgb(var(--r) / 0.9), 0 0 8px rgb(var(--r) / 0.5);
  --mono: 'VT323', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; height: 100%; background: #000; }

body {
  color: var(--green);
  font-family: var(--mono);
  font-size: 20px;
  line-height: 1.2;
  text-shadow: var(--glow);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  overflow: hidden;
  touch-action: manipulation;
}

::selection { background: rgb(var(--g) / 0.85); color: #000; text-shadow: none; }

button, input, textarea { font: inherit; color: inherit; color-scheme: dark; text-shadow: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px dashed var(--dim); outline-offset: 3px; }

#app {
  position: fixed;
  left: 0; right: 0;
  top: var(--app-top, 0px);
  height: var(--app-h, 100%);
  overflow: hidden;
  background: #000;
}

.screen {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);
  animation: crt-in 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes crt-in {
  0% { opacity: 0; transform: scaleY(0.96); filter: brightness(2.2) blur(1.5px); }
  35% { opacity: 1; }
  100% { opacity: 1; transform: none; filter: none; }
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.label { font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }

.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 22px;
  font-size: 20px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--green);
  border: 1px solid var(--faint);
  background: rgb(var(--g) / 0.03);
  box-shadow: inset 0 0 18px rgb(var(--g) / 0.05);
  transition: background 160ms, border-color 160ms, color 160ms;
}
.btn::before, .btn::after { content: ''; position: absolute; width: 7px; height: 7px; border: 1px solid var(--green); opacity: 0.8; }
.btn::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.btn::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.btn:hover:not(:disabled), .btn:focus-visible { background: rgb(var(--g) / 0.1); border-color: var(--dim); outline: none; }
.btn:active:not(:disabled) { background: var(--green); color: #000; text-shadow: none; }
.btn:disabled { opacity: 0.35; cursor: default; }

.blink { animation: blink 1.06s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.spinner { display: inline-block; width: 1ch; margin-right: 0.6em; color: var(--green); }

.noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* ============================================================
   CRT OVERLAY
   ============================================================ */
.crt { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 100; }
.crt > div { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.crt__scan { background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0) 0, rgb(0 0 0 / 0) 2px, rgb(0 0 0 / 0.3) 3px, rgb(0 0 0 / 0) 4px); }
.crt__vignette { background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 58%, rgb(0 0 0 / 0.6) 100%); }
.crt__flicker { background: #000; opacity: 0; animation: crt-flicker 6.4s infinite; }
@keyframes crt-flicker {
  0%, 17%, 19%, 54%, 56.5%, 81%, 82.5%, 100% { opacity: 0; }
  18% { opacity: 0.07; } 55% { opacity: 0.04; } 56% { opacity: 0.09; } 82% { opacity: 0.05; }
}
.crt > .crt__roll {
  bottom: auto; height: 22vh;
  background: linear-gradient(to bottom, rgb(var(--g) / 0), rgb(var(--g) / 0.02) 55%, rgb(var(--g) / 0.038) 92%, rgb(var(--g) / 0));
  animation: crt-roll 8.5s linear infinite;
  will-change: transform;
}
@keyframes crt-roll { from { transform: translateY(-25vh); } to { transform: translateY(105vh); } }
body[data-screen='chat'] .crt__roll { display: none; }

/* ============================================================
   GLITCH TITLE (canvas)
   ============================================================ */
.gtitle { position: relative; display: flex; justify-content: center; width: 100%; }
.gtitle__canvas { display: block; }
.gtitle__fallback {
  margin: 0; text-align: center; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700;
  font-size: clamp(42px, 12vw, 92px); line-height: 1.05;
  animation: hard-flicker 0.9s steps(1, end) infinite;
}
.gtitle__fallback span { display: block; }
@keyframes hard-flicker { 0% { opacity: 1; } 13% { opacity: 0.4; } 17% { opacity: 1; } 52% { opacity: 0.75; } 56% { opacity: 1; } 81% { opacity: 0.25; } 84% { opacity: 1; } }

/* ============================================================
   TERMINAL FIELD
   ============================================================ */
.tfield { display: flex; flex-direction: column; gap: 8px; width: 100%; cursor: text; }
.tfield__frame {
  position: relative; display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 16px;
  border: 1px solid var(--faint);
  background: rgb(var(--g) / 0.025);
  box-shadow: inset 0 0 24px rgb(var(--g) / 0.05);
  transition: border-color 200ms, box-shadow 200ms;
}
.tfield__frame::before, .tfield__frame::after { content: ''; position: absolute; width: 10px; height: 10px; border-color: var(--green); border-style: solid; opacity: 0.75; }
.tfield__frame::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.tfield__frame::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.tfield.is-focused .tfield__frame { border-color: rgb(var(--g) / 0.45); box-shadow: inset 0 0 28px rgb(var(--g) / 0.08), 0 0 18px rgb(var(--g) / 0.08); }
.tfield__prompt { color: var(--dim); font-size: 24px; }
.tfield__box { position: relative; flex: 1; min-width: 0; height: 100%; }
.tfield__input, .tfield__mirror {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  margin: 0; padding: 0;
  font-family: var(--mono); font-size: 26px; letter-spacing: 0.16em; line-height: 56px;
  white-space: pre;
}
.tfield__input {
  border: 0; outline: 0; background: transparent;
  color: transparent; caret-color: transparent; text-shadow: none;
  -webkit-text-fill-color: transparent;
}
.tfield__mirror { pointer-events: none; overflow: hidden; }
.tfield__ph { color: rgb(var(--g) / 0.28); text-shadow: none; }
.tfield .is-under { display: none; }
.tfield.tfield--error .tfield__frame,
.tfield.tfield--error .tfield__frame::before,
.tfield.tfield--error .tfield__frame::after { border-color: rgb(var(--r) / 0.7); }
.tfield.tfield--error .tfield__frame { box-shadow: inset 0 0 24px rgb(var(--r) / 0.07), 0 0 18px rgb(var(--r) / 0.12); animation: shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
.tfield--error .tfield__mirror { color: var(--red); text-shadow: var(--glow-r); }
.tfield--error .tcursor { background: var(--red); }
.tfield.tfield--ok .tfield__frame { border-color: var(--green); box-shadow: inset 0 0 30px rgb(var(--g) / 0.16), 0 0 26px rgb(var(--g) / 0.2); }
.tfield.is-disabled { cursor: default; }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); }
}

/* Flickering typed letters (alias field) */
.fl { animation: char-flicker 2.6s infinite; }
@keyframes char-flicker {
  0%, 100% { opacity: 1; }
  21% { opacity: 1; } 22% { opacity: 0.3; } 23% { opacity: 1; }
  41% { opacity: 1; } 42% { opacity: 0.25; } 43% { opacity: 0.95; } 44% { opacity: 0.5; } 45.5% { opacity: 1; }
  77% { opacity: 1; text-shadow: var(--glow); }
  78% { opacity: 0.75; text-shadow: 0 0 2px rgb(var(--g)), 0 0 14px rgb(var(--g) / 0.8); }
  79% { opacity: 1; text-shadow: var(--glow); }
}

/* Block cursor: solid while typing, pulses when you stop */
.tcursor {
  display: inline-block; width: 1ch; margin-right: 0.16em; letter-spacing: 0; line-height: 1;
  background: var(--green); color: #000; text-shadow: none;
  box-shadow: 0 0 6px rgb(var(--g) / 0.7), 0 0 16px rgb(var(--g) / 0.3);
  animation: cursor-pulse 1.05s ease-in-out infinite;
}
.tcursor.is-typing { animation: none; }
.tcursor.is-idle-unfocused { background: transparent; color: inherit; text-shadow: inherit; box-shadow: inset 0 0 0 1px rgb(var(--g) / 0.6); animation: none; }
@keyframes cursor-pulse { 0%, 45% { opacity: 1; } 55%, 90% { opacity: 0.08; } 100% { opacity: 1; } }

/* ============================================================
   DOTS, CLOCK, STATUS BAR, AVATAR
   ============================================================ */
.dot { position: relative; display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; }
.dot--on { background: var(--green); box-shadow: 0 0 6px rgb(var(--g) / 0.9); animation: dot-breathe 1.8s ease-in-out infinite; }
.dot--on::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  border-radius: 50%; border: 1px solid var(--green);
  animation: dot-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}
.dot--off { background: rgb(var(--w) / 0.85); box-shadow: 0 0 3px rgb(var(--w) / 0.35); }
@keyframes dot-ping { 0% { transform: scale(1); opacity: 0.85; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
@keyframes dot-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.dclock { letter-spacing: 0.12em; }

.sbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 34px; }
.sbar__center { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 18px; line-height: 1; }
.sbar__enc { display: inline-flex; align-items: center; gap: 6px; margin-right: -0.28em; font-size: 12px; letter-spacing: 0.28em; color: var(--dim); }
.sbar__side { display: flex; align-items: center; min-width: 0; }
.sbar__side--r { justify-content: flex-end; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 40px; height: 40px; margin: -4px; padding: 0 6px;
  font-size: 15px; letter-spacing: 0.18em; color: var(--dim); transition: color 150ms;
}
.icon-btn:hover, .icon-btn:focus-visible { color: var(--green); }
.session-timer { font-size: 15px; letter-spacing: 0.14em; color: var(--dim); }

.avatar { position: relative; display: inline-block; flex: none; overflow: hidden; background: #000; border: 1px solid var(--hair); }
.avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.avatar__none { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 14px; color: var(--dim); }

@media (max-width: 370px) {
  .session-timer, .icon-btn { font-size: 13px; letter-spacing: 0.1em; }
}

/* ============================================================
   CLOSED (outside the window)
   ============================================================ */
.closed { justify-content: space-between; align-items: center; }
.closed__top, .closed__foot {
  position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; max-width: 560px; font-size: 14px; letter-spacing: 0.2em; color: var(--dim);
}
.closed__state { display: inline-flex; align-items: center; gap: 8px; color: var(--red); text-shadow: var(--glow-r); }
.closed__led { width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px rgb(var(--r) / 0.9); animation: blink 2.1s steps(1, end) infinite; }
.closed__center { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 4vh, 40px); }

.aclock { display: block; width: min(72vw, 42vh, 330px); height: auto; overflow: visible; filter: drop-shadow(0 0 3px rgb(var(--g) / 0.5)) drop-shadow(0 0 14px rgb(var(--g) / 0.16)); }
.aclock text { font-family: var(--mono); text-shadow: none; }
.aclock__rim { fill: none; stroke: rgb(var(--g) / 0.55); stroke-width: 1.1; }
.aclock__dash { fill: none; stroke: rgb(var(--g) / 0.35); stroke-width: 1.4; stroke-dasharray: 1.5 7.5; }
.aclock__arc { fill: none; stroke: rgb(var(--g) / 0.75); stroke-width: 2; }
.aclock__inner { fill: none; stroke: rgb(var(--g) / 0.18); stroke-width: 0.8; stroke-dasharray: 1 3; }
.aclock__cross { stroke: rgb(var(--g) / 0.12); stroke-width: 0.7; }
.aclock__mark { stroke: rgb(var(--g) / 0.5); stroke-width: 1.4; }
.aclock__mark.is-major { stroke: rgb(var(--g) / 0.9); stroke-width: 2.6; }
.aclock__bit { fill: rgb(var(--g) / 0.2); font-size: 10px; text-anchor: middle; dominant-baseline: central; }
.aclock__bit.is-major { fill: rgb(var(--g) / 0.38); }
.aclock__bit.is-now { fill: #d6ffe0; font-size: 13px; }
.aclock__bit.t1 { fill: rgb(var(--g) / 0.95); }
.aclock__bit.t2 { fill: rgb(var(--g) / 0.75); }
.aclock__bit.t3 { fill: rgb(var(--g) / 0.58); }
.aclock__bit.t4 { fill: rgb(var(--g) / 0.45); }
.aclock__bit.t5 { fill: rgb(var(--g) / 0.34); }
.aclock__bit.t6 { fill: rgb(var(--g) / 0.27); }
.aclock__wedge { fill: rgb(var(--g)); }
.aclock__beam { stroke: rgb(var(--g) / 0.55); stroke-width: 1; }
.aclock__hand--h { fill: #000; stroke: rgb(var(--g)); stroke-width: 1.6; stroke-linejoin: miter; }
.aclock__hand--m { stroke: rgb(var(--g)); stroke-width: 2; stroke-linecap: square; }
.aclock__tip { fill: #000; stroke: rgb(var(--g)); stroke-width: 1.4; }
.aclock__tail { fill: rgb(var(--g)); }
.aclock__hub { fill: #000; stroke: rgb(var(--g)); stroke-width: 1.6; }
.aclock__hubdot { fill: rgb(var(--g)); }
.aclock__tag { fill: rgb(var(--g) / 0.45); font-size: 9px; letter-spacing: 2.5px; text-anchor: middle; }

.closed__countdown { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.closed__digits { display: flex; align-items: flex-start; gap: 6px; font-size: clamp(46px, 14vw, 76px); line-height: 0.9; }
.closed__unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.closed__unit b { font-weight: 400; letter-spacing: 0.06em; }
.closed__unit small { font-size: 12px; letter-spacing: 0.32em; color: var(--dim); text-shadow: none; }
.closed__sep { color: var(--dim); animation: blink 1s steps(1, end) infinite; }
.closed__foot { font-size: 13px; }
.closed__await { color: rgb(var(--g) / 0.4); }
@media (max-width: 420px) {
  .closed__top { font-size: 12px; letter-spacing: 0.14em; }
  .closed__foot { flex-direction: column; gap: 6px; }
}

/* ============================================================
   ACCESS
   ============================================================ */
.access { align-items: center; justify-content: space-between; }
.bootlog {
  position: relative; align-self: stretch; margin: 0; min-height: 4.4em;
  font-family: var(--mono); font-size: 14px; line-height: 1.1; letter-spacing: 0.06em;
  color: rgb(var(--g) / 0.38); text-shadow: 0 0 6px rgb(var(--g) / 0.18); white-space: pre;
}
.access__center { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 560px; }
.access__sub {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin: 14px 0 0;
  font-size: 13px; letter-spacing: 0.3em; color: var(--dim); white-space: nowrap;
}
.access__sub-rule { flex: 1; max-width: 64px; height: 1px; background: var(--faint); }
.access__form { display: flex; flex-direction: column; align-items: stretch; gap: 14px; width: 100%; max-width: 520px; margin-top: clamp(28px, 7vh, 60px); }
.access__status { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; min-height: 20px; font-size: 15px; letter-spacing: 0.2em; color: var(--dim); }
.access__status--error { color: var(--red); text-shadow: var(--glow-r); }
.access__status--ok { color: var(--green); }
.access__detail { font-size: 13px; letter-spacing: 0.16em; color: rgb(var(--r) / 0.75); text-shadow: none; }
.access__hint { color: rgb(var(--g) / 0.35); }
.access__btn { align-self: center; min-width: 200px; margin-top: 6px; }
.access__foot {
  position: relative; display: flex; justify-content: space-between; gap: 16px; width: 100%;
  font-size: 12px; letter-spacing: 0.22em; color: rgb(var(--g) / 0.32); text-shadow: none;
}
@media (max-width: 420px) { .access__foot { flex-direction: column; align-items: center; gap: 4px; } }

/* ============================================================
   UNLOCK
   ============================================================ */
.unlock { align-items: center; justify-content: center; }
.unlock__stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 4vh, 36px); transition: opacity 480ms ease-in, transform 480ms ease-in, filter 480ms ease-in; }
.unlock.is-exit .unlock__stage { opacity: 0; transform: scale(1.06); filter: brightness(1.8) blur(2px); }
.unlock__frame { position: relative; padding: 10px; }
.unlock__canvas { display: block; filter: drop-shadow(0 0 2px rgb(var(--g) / 0.85)) drop-shadow(0 0 10px rgb(var(--g) / 0.32)); }
.unlock.is-grant .unlock__canvas { animation: lock-surge 700ms ease-out both; }
@keyframes lock-surge {
  0% { filter: drop-shadow(0 0 4px rgb(var(--g))) drop-shadow(0 0 30px rgb(var(--g) / 0.8)); }
  100% { filter: drop-shadow(0 0 2px rgb(var(--g) / 0.85)) drop-shadow(0 0 12px rgb(var(--g) / 0.4)); }
}
.unlock__corner { position: absolute; width: 14px; height: 14px; border: 0 solid var(--faint); transition: border-color 400ms; }
.unlock.is-grant .unlock__corner, .unlock.is-exit .unlock__corner { border-color: var(--green); }
.unlock__corner--tl { left: 0; top: 0; border-width: 1px 0 0 1px; }
.unlock__corner--tr { right: 0; top: 0; border-width: 1px 1px 0 0; }
.unlock__corner--bl { left: 0; bottom: 0; border-width: 0 0 1px 1px; }
.unlock__corner--br { right: 0; bottom: 0; border-width: 0 1px 1px 0; }
.unlock__readout { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(300px, 80vw); min-height: 64px; }
.unlock__row { display: flex; justify-content: space-between; width: 100%; font-size: 15px; letter-spacing: 0.22em; color: var(--dim); }
.unlock__bar { width: 100%; height: 3px; background: var(--hair); overflow: hidden; }
.unlock__bar-fill { height: 100%; background: var(--green); box-shadow: 0 0 8px rgb(var(--g) / 0.8); transform: scaleX(0); transform-origin: left; }
.unlock__granted { font-size: 30px; letter-spacing: 0.3em; margin-right: -0.3em; text-shadow: 0 0 1px rgb(var(--g)), 0 0 10px rgb(var(--g) / 0.6), 0 0 26px rgb(var(--g) / 0.3); }

function deriveFromCode(code) {
  var subtle = crypto.subtle;
  var algo = function (salt) { return { name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 250000 }; };
  return subtle.importKey('raw', enc.encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveBits', 'deriveKey'])
    .then(function (base) {
      return Promise.all([
        subtle.deriveBits(algo('preca-underground/v1/auth'), base, 256),
        subtle.deriveKey(algo('preca-underground/v1/e2ee'), base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']),
      ]);

}
function encryptText(key, text) {

  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(p[1]) }, key, fromB64(p[2]))
    .then(function (pt) { return dec.decode(pt); });
}

/* ============================================================
   4. BACKENDS
   Interface used by the UI:
     verifyCode(code)                    -> { ok:true, ticket } | { ok:false, message }
     register(ticket, nickname, avatarId)-> Session { token, user }
     resume(ticket, session)             -> Session
     listRooms(session)                  -> [Room]
     joinRoom(session, roomId, events)   -> { send(text) -> Promise<Message>, close() }
       events: onHistory(msgs) onMessage(msg) onMembers(list) onPresence(id, online) onStatus(s)
   ============================================================ */
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function createHttpBackend() {
  var key = null;
  var base = CONFIG.API_URL.replace(/\/$/, '');
  var wsUrl = CONFIG.WS_URL || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');

  function api(path, opts, token) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    return fetch(base + path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          if (!res.ok) { var e = new Error(body.error || body.message || 'HTTP ' + res.status); e.status = res.status; throw e; }
          return body;
        });
      });
  }
  function open(m) {
    var text = key ? decryptText(key, m.ciphertext).catch(function () { return '[UNDECRYPTABLE PAYLOAD]'; }) : Promise.resolve('[NO KEY]');
    return text.then(function (t) { return { id: m.id, senderId: m.senderId, text: t, sentAt: m.sentAt, status: 'sent' }; });
  }

  return {
    verifyCode: function (code) {
      if (!hasCrypto()) return Promise.resolve({ ok: false, message: 'SECURE CONTEXT REQUIRED · USE HTTPS' });
      return deriveFromCode(code).then(function (d) {
        return api('/auth/verify', { method: 'POST', body: { proof: d.proof } }).then(function (r) {
          key = d.key;
          return { ok: true, ticket: r.ticket };
        }, function (err) {
          if (err.status === 401 || err.status === 403) return { ok: false, message: 'INVALID ACCESS CODE' };
          if (err.status === 423) return { ok: false, message: 'CHANNEL CLOSED' };
          return { ok: false, message: 'NO CARRIER · SERVER UNREACHABLE' };
        });
      });
    },
    register: function (ticket, nickname, avatarId) {
      return api('/users', { method: 'POST', body: { ticket: ticket, nickname: nickname, avatarId: avatarId } });
    },
    resume: function (ticket, session) {
      return api('/sessions/resume', { method: 'POST', body: { ticket: ticket } }, session.token);
    },
    listRooms: function (session) { return api('/rooms', {}, session.token); },
    joinRoom: function (session, roomId, ev) {
      var ws = null, closed = false, retry = 0, retryTimer = 0;
      var pending = {};
      function connect() {
        ev.onStatus('connecting');
        var url = wsUrl + (wsUrl.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(session.token) + '&room=' + encodeURIComponent(roomId);
        try { ws = new WebSocket(url); } catch (e) { ev.onStatus('lost'); retryTimer = setTimeout(connect, 3000); return; }
        ws.onopen = function () { retry = 0; ev.onStatus('live'); };
        ws.onmessage = function (e) {
          var d;
          try { d = JSON.parse(e.data); } catch (err) { return; }
          if (d.type === 'history') Promise.all((d.messages || []).map(open)).then(ev.onHistory);
          else if (d.type === 'message') { if (d.message.senderId !== session.user.id) open(d.message).then(ev.onMessage); }
          else if (d.type === 'members') ev.onMembers(d.members || []);
          else if (d.type === 'presence') ev.onPresence(d.memberId, !!d.online);
          else if (d.type === 'ack') {
            var p = pending[d.clientId];
            delete pending[d.clientId];
            if (p) open(d.message).then(p.resolve);
          }
        };
        ws.onclose = function () {
          if (closed) return;
          ev.onStatus('lost');
          retryTimer = setTimeout(connect, Math.min(1000 * Math.pow(2, retry++), 15000));
        };
      }
      connect();
      return {
        send: function (text) {
          if (!key) return Promise.reject(new Error('NO KEY'));
          if (!ws || ws.readyState !== 1) return Promise.reject(new Error('LINK DOWN'));
          var clientId = uid();
          return encryptText(key, text).then(function (ciphertext) {
            return new Promise(function (resolve, reject) {
              pending[clientId] = { resolve: resolve };
              ws.send(JSON.stringify({ type: 'send', clientId: clientId, ciphertext: ciphertext }));
              setTimeout(function () { if (pending[clientId]) { delete pending[clientId]; reject(new Error('TIMEOUT')); } }, 10000);
            });
          });
        },
        close: function () { closed = true; clearTimeout(retryTimer); if (ws) ws.close(); },
      };
    },
  };
}

/** Text that resolves out of random glyphs, left to right. Always ends on the real text. */
function decode(scope, el, text, duration, delay) {
  duration = duration || 600;
  delay = delay || 0;
  var start = performance.now() + delay, last = 0, done = false;
  function frame(t) {
    var p = clamp01((t - start) / duration);
    var solved = Math.floor(text.length * p), out = text.slice(0, solved);
    for (var i = solved; i < text.length; i++) {
      var ch = text[i];
      out += ch === ' ' || ch === '\n' ? ch : t < start ? ' ' : randGlyph();
    }
    el.textContent = out;
  }
  function finish() { if (!done) { done = true; el.textContent = text; stop(); } }
  frame(performance.now());
  var stop = scope.loop(function (t) {
    if (t - start >= duration) return finish();
    if (t - last < 45) return;
    last = t;
    frame(t);
  });
  scope.timeout(finish, delay + duration + 500);
  return el;
}

    li++; ci = 0;
    if (li >= lines.length) return;
    pre.insertBefore(document.createTextNode('\n'), cursor);
    lineEl = h('span');
    pre.insertBefore(lineEl, cursor);
    scope.timeout(step, 260);

  scope.timeout(step, 250);
  return pre;
}

/** Interference streaks drifting across a black field. */
function signalNoise(scope, density) {
  var canvas = h('canvas', { class: 'noise', 'aria-hidden': 'true' });
  var ctx = canvas.getContext('2d');
  if (!ctx) return canvas;
  var w = 0, hh = 0, last = 0, band = Math.random(), bandUntil = 0, streaks = [];
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; hh = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(hh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  scope.on(window, 'resize', resize);
  scope.loop(function (t) {
    if (!w) resize();
    if (t - last < 33) return;
    last = t;
    if (t > bandUntil) { band = Math.random(); bandUntil = t + rand(900, 3500); }
    while (streaks.length < 34 * density) {
      var clustered = Math.random() < 0.6, long = Math.random() < 0.12;
      streaks.push({
        x: rand(-0.05, 1.05) * w,
        y: Math.round(clustered ? (band + rand(-0.06, 0.06)) * hh : Math.random() * hh),
        w: long ? w * rand(0.25, 0.75) : rand(6, 76),
        h: Math.random() < 0.8 ? 1 : 2,
        born: t, life: rand(120, 820), peak: rand(0.12, long ? 0.3 : 0.62),
      });
    }
    ctx.clearRect(0, 0, w, hh);
    for (var i = streaks.length - 1; i >= 0; i--) {
      var sk = streaks[i], p = (t - sk.born) / sk.life;
      if (p >= 1) { streaks.splice(i, 1); continue; }
      var a = sk.peak * (p < 0.1 ? p / 0.1 : 1 - (p - 0.1) / 0.9) * rand(0.7, 1);
      ctx.fillStyle = 'rgba(66,255,104,' + a.toFixed(3) + ')';
      ctx.fillRect(sk.x, sk.y, sk.w, sk.h);
    }
  });
  return canvas;
}

/**
 * THE TITLE. Rendered once into an offscreen canvas (glow + carved scanlines), then
 * redrawn ~30x a second as horizontal bands that tear sideways, strobe, double and
 * streak. Never sits still.
 */
function glitchTitle(scope, lines) {
  var wrap = h('div', { class: 'gtitle' }, h('h1', { class: 'sr-only' }, lines.join(' ')));
  var canvas = h('canvas', { class: 'gtitle__canvas', 'aria-hidden': 'true' });
  var ctx = canvas.getContext('2d');
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');
  if (!ctx || !octx) {
    wrap.appendChild(h('div', { class: 'gtitle__fallback', 'aria-hidden': 'true' }, lines.map(function (l) { return h('span', null, l); })));
    return wrap;
  }
  wrap.appendChild(canvas);
  var FONT = '"Courier Prime", "Courier New", Courier, monospace';
  var W = 0, H = 0, dpr = 1, laidFor = -1;
  var streaks = [], last = 0, burstUntil = 0, nextBurst = 0, rowsY = [];

  function layout() {
    var avail = wrap.clientWidth;
    if (!avail) return false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.font = '700 100px ' + FONT;
    var widest = 0;
    lines.forEach(function (l) { widest = Math.max(widest, octx.measureText(l).width / 100); });
    var fs = Math.max(30, Math.min(96, (avail * 0.92) / widest));
    var lh = fs * 1.04;
    W = Math.ceil(avail);
    H = Math.ceil(lh * lines.length + fs * 0.45);
    canvas.width = off.width = Math.round(W * dpr);
    canvas.height = off.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, W, H);
    octx.font = '700 ' + fs + 'px ' + FONT;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    var y0 = fs * 0.22 + lh / 2;
    rowsY = lines.map(function (_, i) { return y0 + i * lh; });
    // soft phosphor bloom
    octx.shadowColor = 'rgba(66,255,104,0.65)';
    octx.shadowBlur = fs * 0.32 * dpr;
    octx.fillStyle = 'rgba(66,255,104,0.85)';
    lines.forEach(function (l, i) { octx.fillText(l, W / 2, rowsY[i]); });
    // hot core
    octx.shadowBlur = fs * 0.06 * dpr;
    octx.shadowColor = 'rgba(150,255,170,0.9)';
    octx.fillStyle = '#5cff7c';
    lines.forEach(function (l, i) { octx.fillText(l, W / 2, rowsY[i]); });
    octx.shadowBlur = 0;
    // scanlines carved through the letters, like the reference
    octx.globalCompositeOperation = 'destination-out';
    octx.fillStyle = 'rgba(0,0,0,0.55)';
    for (var y = 0; y < H; y += 3) octx.fillRect(0, y, W, 1);
    octx.globalCompositeOperation = 'source-over';
    laidFor = avail;
    return true;
  }

  scope.on(window, 'resize', function () { laidFor = -1; });
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 48px "Courier Prime"').then(function () { laidFor = -1; }, function () {});
  }

  scope.loop(function (t) {
    if (laidFor !== wrap.clientWidth && !layout()) return;
    if (t - last < 30) return;
    last = t;
    if (!nextBurst) nextBurst = t + 500;
    if (t > nextBurst) { burstUntil = t + rand(80, 320); nextBurst = burstUntil + rand(350, 1900); }
    var burst = t < burstUntil;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // brightness: constant shimmer, frequent dips, the odd near-blackout
    var a = rand(0.72, 1), r = Math.random();
    if (r < 0.07) a = rand(0.2, 0.55);
    else if (r < 0.085) a = 0.05;
    ctx.globalAlpha = a;

    // horizontal bands, some torn sideways
    var y = 0, dy = burst ? rand(-3, 3) : 0;
    while (y < H) {
      var bh = Math.min(H - y, rand(2, burst ? 16 : 9));
      var dx = 0, p = Math.random();
      if (p < (burst ? 0.4 : 0.08)) dx = (Math.random() < 0.5 ? -1 : 1) * (burst ? rand(4, 30) : rand(1, 6));
      ctx.drawImage(off, 0, y * dpr, W * dpr, bh * dpr, dx, y + dy, W, bh);
      y += bh;
    }
    // ghost echo
    if (burst || Math.random() < 0.15) {
      ctx.globalAlpha = a * rand(0.15, 0.3);
      ctx.drawImage(off, (Math.random() < 0.5 ? -1 : 1) * rand(3, 10), 0, W, H);
    }
    // overdriven stripe
    if (Math.random() < (burst ? 0.6 : 0.12)) {
      var hy = Math.random() * H, hb = rand(2, 7);
      ctx.globalAlpha = 0.9;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(off, 0, hy * dpr, W * dpr, hb * dpr, burst ? rand(-8, 8) : 0, hy, W, hb);
      ctx.globalCompositeOperation = 'source-over';
    }
    // streaks shooting out of the letters
    var spawn = burst ? 4 : Math.random() < 0.5 ? 1 : 0;
    for (var k = 0; k < spawn; k++) {
      var row = rowsY[(Math.random() * rowsY.length) | 0] || H / 2;
      streaks.push({ x: rand(-0.1, 1) * W, y: Math.round(row + rand(-0.45, 0.45) * (H / lines.length)), w: rand(10, W * 0.5), born: t, life: rand(60, 420), peak: rand(0.2, 0.7) });
    }
    for (var i = streaks.length - 1; i >= 0; i--) {
      var sk = streaks[i], q = (t - sk.born) / sk.life;
      if (q >= 1) { streaks.splice(i, 1); continue; }
      ctx.globalAlpha = sk.peak * (1 - q);
      ctx.fillStyle = '#42ff68';
      ctx.fillRect(sk.x, sk.y, sk.w, 1);
    }
    ctx.globalAlpha = 1;
  });
  return wrap;
}

    if (a <= 0.01) return;
    var hot = a > 1.25;
    ctx.fillStyle = hot ? 'rgba(214,255,224,1)' : 'rgba(66,255,104,' + Math.min(1, a).toFixed(3) + ')';
    var ch = c.glitch > 0 ? randGlyph() : c.bit;
    ctx.fillText(ch, x, y);
    ctx.fillText(ch, x + 0.6, y); // phosphor weight
  }

  function frame(now) {
    if (finished) return;
    var t = now - start;
    if (t >= T.exit) { finish(); return; }

    setPhase(t < T.scan ? 'decrypt' : t < T.turn ? 'turn' : t < T.lift ? 'lift' : t < T.grant ? 'grant' : 'exit');
    var prog = clamp01(t / T.turn);
    fill.style.transform = 'scaleX(' + prog.toFixed(3) + ')';
    var pc = String(Math.round(prog * 100));
    pct.textContent = ('000' + pc).slice(-3) + '%';

    // bits keep mutating, with the odd corrupted glyph and torn row, until access settles them
    if (t < T.grant && now - lastScramble > (t > T.lift ? 160 : 70)) {
      lastScramble = now;
      var rate = t > T.lift ? 0.08 : 0.22;
      [shackle, body].forEach(function (list) {
        list.forEach(function (c) {
          if (Math.random() < rate) c.bit = c.bit === '0' ? '1' : '0';
          c.glitch = Math.random() < 0.012 ? 2 : Math.max(0, c.glitch - 1);
        });
      });
      rowJitter = {};
      if (Math.random() < 0.35) rowJitter[(Math.random() * ROWS) | 0] = rand(-4, 4);
    }

    ctx.clearRect(0, 0, W, H);
    ctx.font = F + 'px VT323, monospace';
    var ox = 0, oy = 0;
    if (t > T.scan && t < T.scan + 260) { // mechanical jolt as the key turns
      var kk = 1 - (t - T.scan) / 260;
      ox = rand(-0.5, 0.5) * F * 0.35 * kk;
      oy = rand(-0.5, 0.5) * F * 0.2 * kk;
    }
    var lift = -LIFT * rowH * easeOutBack(clamp01((t - T.turn) / (T.lift - T.turn)));
    var half = cellW / 2;

    // shackle, clipped at the body's top edge so its tucked legs stay hidden until it lifts
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, pad + BODY_TOP * rowH + oy - rowH * 0.06);
    ctx.clip();
    shackle.forEach(function (c) {
      var gr = SHACKLE_TOP + c.row;
      draw(c, pad + c.col * cellW + half + ox + (rowJitter[gr] || 0), pad + gr * rowH + lift + oy, intensity(c, gr, t));
    });
    ctx.restore();

    body.forEach(function (c) {
      var gr = BODY_TOP + c.row;
      draw(c, pad + c.col * cellW + half + ox + (rowJitter[gr] || 0), pad + gr * rowH + oy, intensity(c, gr, t));
    });

    // the key, turning in the keyhole: | / -
    if (t > T.materialize) {
      var turnP = clamp01((t - T.scan) / (T.turn - T.scan));
      var glyph = ['|', '/', '-', '-'][Math.min(3, Math.floor(turnP * 4))];
      var bright = t > T.scan ? 1 : 0.35 + 0.25 * Math.sin(t / 120);
      ctx.fillStyle = bright >= 1 ? 'rgba(214,255,224,1)' : 'rgba(66,255,104,' + bright.toFixed(3) + ')';
      ctx.fillText(glyph, pad + KEYHOLE.col * cellW + half + ox, pad + (BODY_TOP + KEYHOLE.row - 0.5) * rowH + oy);
    }
  }

  var begun = false;
  function begin() {
    if (begun || scope.isDead()) return;
    begun = true;
    layout();
    start = performance.now();
    scope.loop(frame);
  }
  scope.on(window, 'resize', layout);
  // wait briefly for the terminal font so glyph metrics are right; never block on it
  if (document.fonts && document.fonts.load) document.fonts.load('20px VT323').then(begin, begin);
  scope.timeout(begin, 600);
}

/* ---------- 6.4 Identity (first visit) ---------- */
function screenRegister(root, scope, props) {
  root.classList.add('register');
  var busy = false, avatarId = AVATARS.length ? AVATARS[0].id : '';
  var hint = h('div', { class: 'register__hint', role: 'status', 'aria-live': 'polite' });
  var previewImg = h('span');
  var previewNick = h('span', { class: 'register__preview-nick' }, 'alias');
  var btn = h('button', { class: 'btn register__btn', type: 'submit' }, 'Initialize');
  var field = terminalInput(scope, {
    label: 'Alias', name: 'alias', maxLength: CONFIG.NICK_MAX, flicker: true, autofocus: true, placeholder: 'choose_wisely',
    transform: function (v) { return v.replace(/\s/g, '_'); },
    onSubmit: submit,
    onInput: function (v) { previewNick.textContent = v || 'alias'; setHint(null); },
  });
  var grid = h('div', { class: 'register__grid', role: 'radiogroup', 'aria-label': 'Avatar' });
  var marks = AVATARS.map(function (a, i) {

      h('span', { class: 'mark__img' }, h('img', { src: a.src, alt: '', draggable: 'false' }), h('span', { class: 'mark__scan' })));
    b.addEventListener('click', function () { if (!busy) select(a.id); });
    grid.appendChild(b);
    return b;
  });
  function select(id) {
    avatarId = id;
    AVATARS.forEach(function (a, i) { marks[i].classList.toggle('is-on', a.id === id); marks[i].setAttribute('aria-checked', a.id === id ? 'true' : 'false'); });

    hint.className = 'register__hint' + (err ? ' is-error' : '');

    field.setTone(err ? 'error' : 'idle');
  }
  function validate(n) {
    if (n.length < CONFIG.NICK_MIN) return 'ALIAS TOO SHORT · MIN ' + CONFIG.NICK_MIN;
    if (n.length > CONFIG.NICK_MAX) return 'ALIAS TOO LONG · MAX ' + CONFIG.NICK_MAX;
    if (!/^[A-Za-z0-9_.-]+$/.test(n)) return 'ONLY A-Z 0-9 _ . - ALLOWED';
    if (!avatarId) return 'SELECT AN AVATAR';
    return null;
  }
  function submit() {
    if (busy) return;
    var nick = field.value, err = validate(nick);
    if (err) { setHint(err); field.shake(); return; }
    busy = true;
    field.setDisabled(true);
    btn.disabled = true;
    empty(btn);

    btn.appendChild(document.createTextNode('FORGING'));
    backend.register(props.ticket, nick, avatarId).then(function (session) {

      field.setTone('ok');
      empty(btn);

    }, function (e) {
      if (scope.isDead()) return;

    h('div', { class: 'register__marks' }, h('span', { class: 'label' }, 'Select your mark'), grid),
    h('div', { class: 'register__preview' }, h('span', { class: 'label' }, 'Preview'), h('div', { class: 'register__preview-row' }, previewImg, previewNick, dot(true))),
    btn);

  var title = h('h2', { class: 'register__title' });
  root.appendChild(h('div', { class: 'register__scroll' },
    h('header', { class: 'register__head' }, h('span', { class: 'label' }, 'Identity // 01'), h('span', { class: 'label' }, 'New operative')),
    decode(scope, title, 'CREATE YOUR ALIAS', 700),
    h('p', { class: 'register__lede' }, 'No real names. Pick an alias and a mark. This is how the others will see you.'),
    form));

  if (avatarId) select(avatarId);
}

/* ---------- 6.6 Chat ---------- */
function screenChat(root, scope, props) {
  root.classList.add('chat');
  var session = props.session, room = props.room, me = session.user.id;
  var GROUP_MS = 3 * 60000;
  var members = {}, ready = false, atBottom = true, unseen = 0, last = null, rosterOpen = false;

  var exit = h('button', { class: 'icon-btn', 'aria-label': 'Leave room' }, '< EXIT');
  exit.addEventListener('click', props.onExit);
  var onlineDot = dot(false), onlineTxt = h('span', null, '-/- ONLINE');
  var rosterBtn = h('button', { class: 'chat__roster-btn', 'aria-expanded': 'false' }, onlineDot, onlineTxt);
  var linkEl = h('span', { class: 'chat__link' });
  var roster = h('ul', { class: 'roster', 'aria-label': 'Members', hidden: true });
  var waiting = h('div', { class: 'chat__waiting' }, spinner(scope), 'ESTABLISHING SECURE LINK');
  var inner = h('div');
  var feed = h('div', { class: 'chat__feed', role: 'log', 'aria-live': 'polite' }, waiting, inner);
  var pill = h('button', { class: 'chat__unseen', hidden: true });
  var box = composer(scope, send);

  rosterBtn.addEventListener('click', function () {
    rosterOpen = !rosterOpen;
    rosterBtn.setAttribute('aria-expanded', String(rosterOpen));
    roster.hidden = !rosterOpen;
    renderRoster();
  });
  pill.addEventListener('click', function () { stick(true); });

  root.appendChild(h('div', { class: 'chat__top' },
    statusBar(scope, exit, sessionTimer(scope)),
    h('div', { class: 'chat__channel' }, h('span', { class: 'chat__room' }, '#' + room.name), linkEl, rosterBtn),
    roster));
  root.appendChild(feed);
  root.appendChild(pill);
  root.appendChild(box.el);

  function memberList() {
    return Object.keys(members).map(function (k) { return members[k]; })
      .sort(function (a, b) { return (b.online - a.online) || a.nickname.localeCompare(b.nickname); });
  }
  function renderRoster() {
    if (!rosterOpen) return;
    empty(roster);
    memberList().forEach(function (m) {
      roster.appendChild(h('li', { class: m.online ? '' : 'is-off' }, avatar(m.avatarId, 22),
        h('span', { class: 'roster__nick' }, m.nickname, m.id === me ? h('span', { class: 'roster__me' }, ' (you)') : null), dot(m.online)));
    });
  }
  function renderMembers() {
    var list = memberList(), on = list.filter(function (m) { return m.online; }).length;
    onlineTxt.textContent = on + '/' + list.length + ' ONLINE';
    setDot(onlineDot, on > 0);
    // refresh names, avatars and dots already printed in the feed
    Array.prototype.forEach.call(inner.querySelectorAll('[data-member]'), function (el) {
      var m = members[el.getAttribute('data-member')];
      if (!m) return;
      var role = el.getAttribute('data-role');
      if (role === 'dot') setDot(el, m.online);
      else if (role === 'nick') el.textContent = m.nickname;
      else if (role === 'av' && !el.getAttribute('data-filled')) { el.setAttribute('data-filled', '1'); empty(el); el.appendChild(avatar(m.avatarId, 22)); }
    });
    renderRoster();
  }
  function stick(force) {
    if (force || atBottom) {
      feed.scrollTop = feed.scrollHeight;
      atBottom = true;
      unseen = 0;
      pill.hidden = true;
    }
  }
  function afterAppend(force) {
    if (waiting.parentNode) waiting.remove();
    if (force || atBottom) stick(true);
    else { unseen++; pill.textContent = unseen + ' NEW ↓'; pill.hidden = false; }
  }
  function addSys(text) {
    inner.appendChild(h('div', { class: 'sys' }, h('span', null, text + ' · ' + fmtClock(new Date(), false))));
    last = null;
    afterAppend(false);
  }
  function addMsg(msg, live, force) {
    var mine = msg.senderId === me, m = members[msg.senderId];
    var head = !last || last.senderId !== msg.senderId || msg.sentAt - last.sentAt > GROUP_MS;
    last = { senderId: msg.senderId, sentAt: msg.sentAt };
    var time = fmtClock(new Date(msg.sentAt), false);
    var art = h('article', { class: 'msg' + (mine ? ' msg--mine' : '') + (head ? ' is-head' : '') + (live ? ' is-live' : '') });
    if (head && mine) art.appendChild(h('header', { class: 'msg__head' }, h('span', { class: 'msg__time' }, time), h('span', { class: 'msg__you' }, 'YOU')));
    if (head && !mine) {
      var av = h('span', { 'data-member': msg.senderId, 'data-role': 'av' });
      if (m) { av.setAttribute('data-filled', '1'); av.appendChild(avatar(m.avatarId, 22)); } else av.appendChild(avatar('', 22));
      var nick = h('span', { class: 'msg__nick', 'data-member': msg.senderId, 'data-role': 'nick' }, m ? m.nickname : 'unknown');
      var d = dot(!!(m && m.online));
      d.setAttribute('data-member', msg.senderId);
      d.setAttribute('data-role', 'dot');
      art.appendChild(h('header', { class: 'msg__head' }, av, nick, d, h('span', { class: 'msg__time' }, time)));
    }
    var body = h('div', { class: 'msg__body' });
    if (live && !mine) decode(scope, body, msg.text, Math.min(520, 160 + msg.text.length * 8));
    else body.textContent = msg.text;
    art.appendChild(body);
    var state = null;
    if (mine) { state = h('div', { class: 'msg__state' }); art.appendChild(state); }
    inner.appendChild(art);
    afterAppend(force);
    return state;
  }
  function setState(el, st, retry) {
    empty(el);
    el.className = 'msg__state msg__state--' + st;
    if (st === 'sending') el.textContent = 'ENCRYPTING...';
    if (st === 'failed') { var b = h('button', null, 'NOT DELIVERED · TAP TO RETRY'); b.addEventListener('click', retry); el.appendChild(b); }
  }
  function transmit(stateEl, text) {
    setState(stateEl, 'sending');
    link.send(text).then(function () { if (!scope.isDead()) setState(stateEl, 'sent'); }, function () {
      if (!scope.isDead()) setState(stateEl, 'failed', function () { transmit(stateEl, text); });
    });
  }
  function send(text) {
    var state = addMsg({ id: 'local-' + uid(), senderId: me, text: text, sentAt: Date.now() }, false, true);
    transmit(state, text);
  }
  function setStatus(st) {
    linkEl.className = 'chat__link' + (st === 'lost' ? ' is-lost' : '');
    empty(linkEl);
    if (st !== 'live') { linkEl.appendChild(spinner(scope)); linkEl.appendChild(document.createTextNode(st === 'lost' ? 'LINK LOST · RETRYING' : 'LINKING')); }
    box.setDisabled(st !== 'live');
  }

  scope.on(feed, 'scroll', function () {
    atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 48;
    if (atBottom && unseen) { unseen = 0; pill.hidden = true; }
  });
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { if (atBottom) feed.scrollTop = feed.scrollHeight; });
    ro.observe(feed);
    ro.observe(inner);
    scope.add(function () { ro.disconnect(); });
  }

  var link = backend.joinRoom(session, room.id, {
    onHistory: function (msgs) {
      if (scope.isDead()) return;
      empty(inner);
      last = null;
      addSys('SECURE SESSION ESTABLISHED');
      msgs.forEach(function (m) { addMsg(m, false, false); });
      stick(true);
      ready = true;
    },
    onMessage: function (m) { if (!scope.isDead()) addMsg(m, true, false); },
    onMembers: function (list) {
      if (scope.isDead()) return;
      members = {};
      list.forEach(function (m) { members[m.id] = Object.assign({}, m); });
      renderMembers();
    },
    onPresence: function (id, online) {
      var m = members[id];
      if (scope.isDead() || !m || m.online === online) return;
      m.online = online;
      renderMembers();
      if (ready) addSys(m.nickname + (online ? ' CONNECTED' : ' WENT DARK'));
    },
    onStatus: function (st) { if (!scope.isDead()) setStatus(st); },
  });
  scope.add(function () { link.close(); });
}

}

/* ============================================================
   7. APP CONTROLLER
   ============================================================ */
var SESSION_KEY = 'pu.session';
var backend = null;
var app = {
  stage: 'access', ticket: null, session: null, room: null, terminated: false, open: false,
  resumed: Promise.resolve(null),
};
var current = { key: null, scope: null };
// ?gate=open / ?gate=closed only works with the mock backend (testing outside the window).
var gateOverride = CONFIG.BACKEND === 'mock' ? (location.search.match(/[?&]gate=(open|closed)/) || [])[1] : null;

function mount(key, build, props) {
  if (current.key === key) return;
  if (current.scope) current.scope.dispose();
  var scope = createScope();
  var root = h('main', { class: 'screen' });
  var host = document.getElementById('app');
  empty(host);
  host.appendChild(root);
  document.body.setAttribute('data-screen', key);
  current = { key: key, scope: scope };
  try { build(root, scope, props || {}); } catch (e) { console.error(e); }
}

function render() {
  if (app.terminated) return mount('terminated', screenTerminated, { onDone: function () { app.terminated = false; render(); } });
  if (!app.open) return mount('closed', screenClosed);
  if (app.stage === 'unlock') return mount('unlock', screenUnlock, { operative: app.session && app.session.user.nickname, onDone: unlocked });
  if (app.stage === 'register' && app.ticket) return mount('register', screenRegister, { ticket: app.ticket, onDone: registered });
  if (app.stage === 'rooms' && app.session) {
    return mount('rooms', screenRooms, {
      session: app.session,
      onEnter: function (room) { app.room = room; app.stage = 'chat'; render(); },
      onDisconnect: disconnect,
      onPurge: function () { drop(SESSION_KEY); app.session = null; disconnect(); },
    });
  }
  if (app.stage === 'chat' && app.session && app.room) {
    return mount('chat:' + app.room.id, screenChat, { session: app.session, room: app.room, onExit: function () { app.stage = 'rooms'; render(); } });
  }
  app.stage = 'access';
  mount('access', screenAccess, { onGranted: granted });
}

function granted(ticket) {
  app.ticket = ticket;
  // re-validate a remembered identity while the lock animation plays
  app.resumed = app.session ? backend.resume(ticket, app.session).catch(function () { return null; }) : Promise.resolve(null);
  app.stage = 'unlock';
  render();
}
function unlocked() {
  app.resumed.then(function (s) {
    if (s) { app.session = s; save(SESSION_KEY, s); app.stage = 'rooms'; }
    else { app.session = null; drop(SESSION_KEY); app.stage = 'register'; }
    render();
  });
}
function registered(s) { app.session = s; save(SESSION_KEY, s); app.stage = 'rooms'; render(); }
function disconnect() { app.ticket = null; app.room = null; app.stage = 'access'; render(); }

/** Pin the app to the visible viewport so the phone keyboard never covers the message box. */
function trackViewport() {
  var vv = window.visualViewport, rs = document.documentElement.style;
  if (!vv) return;
  function update() {
    rs.setProperty('--app-h', vv.height + 'px');
    rs.setProperty('--app-top', vv.offsetTop + 'px');
    if (window.scrollY) window.scrollTo(0, 0);
  }
  update();
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
}

function installAssets() {
  var A = window.PU_ASSETS || {};
  var css = '';
  if (A.vt323) css += "@font-face{font-family:'VT323';font-weight:400;font-display:block;src:url(data:font/woff2;base64," + A.vt323 + ") format('woff2')}";
  if (A.courier) css += "@font-face{font-family:'Courier Prime';font-weight:700;font-display:block;src:url(data:font/woff2;base64," + A.courier + ") format('woff2')}";
  document.head.appendChild(h('style', null, css));
  AVATARS = (A.avatars || []).concat(CONFIG.EXTRA_AVATARS || []);
}

function boot() {
  installAssets();
  backend = CONFIG.BACKEND === 'http' ? createHttpBackend() : createMockBackend();
  app.session = load(SESSION_KEY);
  trackViewport();
  var first = true;
  ticker.sub(function (now) {
    var open = gateOverride === 'open' ? true : gateOverride === 'closed' ? false : isWindowOpen(now);
